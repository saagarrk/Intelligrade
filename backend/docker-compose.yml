version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: intelligrade-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: intelligrade_db
      MYSQL_USER: intelligrade_user
      MYSQL_PASSWORD: intelligrade_secure_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - intelligrade-net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  springboot-backend:
    build:
      context: ./springboot
      dockerfile: Dockerfile
    container_name: intelligrade-springboot
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: intelligrade_db
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - intelligrade-net

volumes:
  mysql_data:

networks:
  intelligrade-net:
    driver: bridge
