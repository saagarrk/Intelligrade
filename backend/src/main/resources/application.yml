server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: intelligrade-backend-engine
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:intelligrade_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# IntelliGrade Security, Python AI Microservice & Gemini Configuration
intelligrade:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    endpoint: ${AI_SERVICE_EVAL_ENDPOINT:/api/ai/evaluate}
    api-key: ${AI_SERVICE_SECRET_KEY:intelligrade-ai-internal-secret-token-2026}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.8-flash
    leniency-threshold: 82.0
